name: Build MCLI binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64-bit
            os: windows-latest
            python: "3.13"
            architecture: x64
            binary: dist/mcli.exe
            artifact: mcli-windows-x64

          - name: Windows 32-bit
            os: windows-latest
            python: "3.12"
            architecture: x86
            binary: dist/mcli.exe
            artifact: mcli-windows-x86

          - name: Linux 64-bit
            os: ubuntu-latest
            python: "3.13"
            architecture: x64
            binary: dist/mcli
            artifact: mcli-linux-x64

          - name: Linux 32-bit
            os: ubuntu-latest
            python: "3.13"
            architecture: x64
            binary: dist/mcli
            artifact: mcli-linux-x86
            linux32: true

          - name: macOS Intel
            os: macos-15-intel
            python: "3.13"
            architecture: x64
            binary: dist/mcli
            artifact: mcli-macos-intel

          - name: macOS Apple Silicon
            os: macos-15
            python: "3.13"
            architecture: arm64
            binary: dist/mcli
            artifact: mcli-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Linux 32-bit in i386 container
        if: matrix.linux32 == true
        shell: bash
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm sh -lc '
            apt-get update &&
            apt-get install -y python3 python3-pip python3-venv build-essential &&
            python3 -m venv .venv32 &&
            .venv32/bin/pip install --upgrade pip &&
            .venv32/bin/pip install . "pyinstaller>=6.16,<7" &&
            .venv32/bin/python scripts/build_binary.py
          '

      - name: Set up Python
        if: matrix.linux32 != true
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install build dependencies
        if: matrix.linux32 != true
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.16,<7"

      - name: Build binary
        if: matrix.linux32 != true
        run: python scripts/build_binary.py

      - name: Smoke test
        if: matrix.linux32 != true
        shell: bash
        run: '"${{ matrix.binary }}" --help'

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/mcli.exe package/mcli.exe
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp dist/mcli package/mcli
          chmod +x package/mcli
          cp README.md package/README.md
          tar -C package -czf "${{ matrix.artifact }}.tar.gz" mcli README.md

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
