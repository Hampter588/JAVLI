name: Build javli binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows 64-bit", os: windows-latest, python: "3.13", architecture: x64, binary: "dist/javli.exe", artifact: "javli-windows-x64" }
          - { name: "Windows 32-bit", os: windows-latest, python: "3.12", architecture: x86, binary: "dist/javli.exe", artifact: "javli-windows-x86" }
          - { name: "Linux 64-bit", os: ubuntu-latest, python: "3.13", architecture: x64, binary: "dist/javli", artifact: "javli-linux-x64" }
          - { name: "Linux 32-bit", os: ubuntu-latest, python: "3.13", architecture: x64, binary: "dist/javli", artifact: "javli-linux-x86", linux32: true }
          - { name: "macOS Intel", os: macos-15-intel, python: "3.13", architecture: x64, binary: "dist/javli", artifact: "javli-macos-intel" }
          - { name: "macOS Apple Silicon", os: macos-15, python: "3.13", architecture: arm64, binary: "dist/javli", artifact: "javli-macos-arm64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux 32-bit in i386 container
        if: matrix.linux32 == true
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          printf 'import os\nfrom pathlib import Path\nPath("mcli/_build_secrets.py").write_text("CURSEFORGE_API_KEY = " + repr(os.environ.get("CURSEFORGE_API_KEY", "")) + "\\\\n", encoding="utf-8")\n' > /tmp/inject_cf.py
          docker run --rm -e CURSEFORGE_API_KEY --platform linux/386 -v "$PWD:/src" -v /tmp/inject_cf.py:/tmp/inject_cf.py:ro -w /src i386/debian:bookworm sh -lc '
            apt-get update &&
            apt-get install -y python3 python3-pip python3-venv build-essential &&
            python3 /tmp/inject_cf.py &&
            python3 -m venv .venv32 &&
            .venv32/bin/pip install --upgrade pip &&
            .venv32/bin/pip install . "pyinstaller>=6.16,<7" &&
            .venv32/bin/python scripts/build_binary.py
          '
      - name: Set up Python
        if: matrix.linux32 != true
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Inject CurseForge API key
        if: matrix.linux32 != true
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          key=os.environ.get("CURSEFORGE_API_KEY","")
          Path("mcli/_build_secrets.py").write_text("CURSEFORGE_API_KEY = "+repr(key)+"\n",encoding="utf-8")
          PY
      - name: Install build dependencies
        if: matrix.linux32 != true
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.16,<7"
      - name: Build binary
        if: matrix.linux32 != true
        run: python scripts/build_binary.py
      - name: Smoke test
        if: matrix.linux32 != true
        shell: bash
        run: '"${{ matrix.binary }}" --help'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/javli.exe package/javli.exe
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip" -Force
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp dist/javli package/javli
          chmod +x package/javli
          cp README.md package/README.md
          tar -C package -czf "${{ matrix.artifact }}.tar.gz" javli README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "javli $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
